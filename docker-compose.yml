services:
  shift-workbench:
    build: .
    image: daiqiongzhao/gzt:latest
    container_name: shift-workbench
    ports:
      - "8090:8080"
    # 密钥/配置注入说明：
    #   - 可选在 compose 同目录放 .env 显式注入强密钥（JWT_SECRET / AES_KEY）：
    #       推荐用 openssl rand -hex 32 生成；显式注入会优先于自动生成，并持久化到数据卷。
    #   - 若不加（无 SSH / 仅 UI 首次部署，如群晖、Portainer、NAS）：
    #       应用会判定为首次启动，在数据卷上自动生成强随机密钥并持久化（/data/secrets.env），
    #       之后每次启动自动复用，无需手工配置。
    #   - 警告：对已运行过的数据卷更换 JWT_SECRET / AES_KEY 会导致全员被登出且历史密文解不开，
    #     应用会拒绝启动以保护既有数据；如需重置请删除数据卷 /data/secrets.env 后重启。
    environment:
      APP_PORT: "8080"
      DB_PATH: "/data/swb.db"
      # 留空即由应用自动生成/复用数据卷密钥；显式设置强值则使用该值
      JWT_SECRET: "${JWT_SECRET:-}"
      AES_KEY: "${AES_KEY:-}"
      TZ: "Asia/Shanghai"
    volumes:
      - /opt/swb/data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
